[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portmark"
version = "0.1.0"
description = "Provider-neutral, capability-secured portable agent reference runtime"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["cryptography==50.0.1"]

[project.optional-dependencies]
a2a = ["a2a-sdk==1.1.2"]
wasmtime = ["wasmtime==48.0.0"]

[project.scripts]
portmark = "portmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portmark = ["wasm_runner.mjs", "wasmtime_component_runner.py"]
