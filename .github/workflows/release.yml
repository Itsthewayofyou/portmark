name: Release

# Publishes to PyPI using Trusted Publishing: GitHub proves this workflow's identity
# to PyPI with a short-lived OIDC token, so no API token exists to store or leak.
# There is deliberately no `password:` key and no `secrets.` reference below.
#
# Triggered ONLY by pushing a version tag:  git tag v0.3.0 && git push origin v0.3.0
#
# workflow_dispatch is deliberately absent. It would let anyone with write access run
# this workflow from any branch, where github.ref is not a tag -- skipping the
# tag/version agreement check and publishing whatever that branch contains. A failed
# publish is re-run from the Actions UI on the original tag run instead, so nothing
# is lost by leaving it out.
#
# Every action is pinned to a commit SHA, not a moving tag. The publish job holds
# id-token: write, which is enough to release under this project's name, so a
# compromised `@release/v1` or `@v7` would be a supply-chain path straight to PyPI.
# Dependabot bumps these pins; see .github/dependabot.yml.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the tag's commit can be checked against main below.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Section 11 #4: any v* tag could trigger this workflow, from any commit. Only a commit that
      # is already on protected main may be published. The tag is resolved to its commit (^{commit}
      # peels an annotated tag) and must equal the commit this run checked out.
      - name: Check the tag's commit is on main
        run: |
          TAG_COMMIT=$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")
          echo "tag=${GITHUB_REF_NAME} commit=${TAG_COMMIT} run=${GITHUB_SHA}"
          test "$TAG_COMMIT" = "$GITHUB_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/main

      # Section 11 #4: every tool and dependency comes from the hash-pinned exports of uv.lock.
      - name: Install hash-locked tooling
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/bootstrap.txt
          python -m pip install --require-hashes --no-deps -r requirements/release.txt
          python scripts/lock_requirements.py --check

      # A tag can point at any commit, including one that never passed CI.
      # Publishing is irreversible on PyPI, so re-run the suite against the exact
      # tree being shipped rather than trusting that main was green.
      - name: Install package
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/runtime.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Run regression tests
        run: python -m unittest discover -s tests

      # Unconditional: there is no trigger that reaches this job without a tag, and a
      # skipped check is indistinguishable from a passing one.
      - name: Check the tag matches the package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import importlib.metadata as m; print(m.version('portmark'))")
          echo "tag=$TAG_VERSION package=$PKG_VERSION"
          test "$TAG_VERSION" = "$PKG_VERSION"

      # --no-isolation: build with the hash-locked setuptools above instead of fetching an unpinned
      # build environment, so the wheel is built in the locked environment.
      - name: Build distributions
        run: |
          rm -rf dist
          python -m build --no-isolation

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      # Section 11 #4: a CycloneDX SBOM of the released package's dependencies (runtime + every
      # extra), exported from the same uv.lock the build installed from. Kept out of dist/ so the
      # publish step uploads only distributions.
      - name: Generate SBOM
        run: |
          mkdir -p sbom
          uv export --frozen --preview-features sbom-export --format cyclonedx1.5 --no-default-groups --all-extras --output-file "sbom/portmark-${GITHUB_REF_NAME#v}.cdx.json"
          python -c "import json, sys; d = json.load(open(sys.argv[1])); assert d['bomFormat'] == 'CycloneDX' and d['components'], 'empty SBOM'" sbom/*.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/

  attest:
    # Section 11 #4: signed GitHub build-provenance and SBOM attestations for the distributions
    # (verify with `gh attestation verify <file> --repo Itsthewayofyou/portmark`). A separate job,
    # so neither the build job nor the publish job gains these permissions.
    name: Attest provenance and SBOM
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # All three are required by the pinned actions/attest (v4.2.1 under attest-build-provenance,
      # v4.1.0 under attest-sbom): id-token mints the Sigstore signing token, attestations persists
      # the attestation, artifact-metadata creates the artifact storage record.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*
          sbom-path: sbom/*.cdx.json

  publish:
    name: Publish to PyPI
    needs: [build, attest]
    runs-on: ubuntu-latest
    # Named environment so PyPI can pin the publisher to it, and so a manual
    # approval rule can be added on the GitHub side without touching this file.
    environment:
      name: pypi
      url: https://pypi.org/p/portmark
    permissions:
      # The only permission this job holds. It cannot read the repository,
      # and it holds no credential that outlives the run.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # PEP 740 attestations (signed provenance on PyPI). This is the action's default; it is
          # set explicitly so a future edit cannot drop it silently (Section 11 #4).
          attestations: true
