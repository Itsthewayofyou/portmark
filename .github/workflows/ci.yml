name: CI

on:
  # Unfiltered `push` plus `pull_request` ran the whole matrix twice for every
  # push to a branch with an open PR, doubling load on the runner. Branch pushes
  # are now covered by the pull_request event alone.
  push:
    branches: [main]
  pull_request:

concurrency:
  # Supersede in-flight runs for the same PR; never cancel a run for main.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      # Section 11 #4: every install is from the hash-pinned exports of uv.lock (requirements/*.txt).
      # --require-hashes refuses changed bytes; --no-deps resolves nothing at install time; the
      # package itself is built with the hash-locked setuptools (--no-build-isolation).
      - name: Install hash-locked build tooling
        run: python -m pip install --require-hashes --no-deps -r requirements/bootstrap.txt
      - name: Install hash-locked dependencies and test tooling
        run: python -m pip install --require-hashes --no-deps -r requirements/ci.txt
      - name: Install package
        run: python -m pip install --no-deps --no-build-isolation -e . && python -m pip check
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check security.py coverage
        run: |
          coverage run --source=portmark.security -m unittest discover -s tests -q
          coverage report --include='src/portmark/security.py' --fail-under=95
      - name: Run parser fuzz target
        run: python tests/fuzz_a2a_parser.py
      - name: Run security scan
        run: bandit -q -r src tests
      - name: Run dependency vulnerability audit
        # Fails closed on vulnerabilities AND on anything that could not be audited,
        # with one named exemption for portmark's own editable install. See the module
        # docstring for why plain `pip-audit --strict` deadlocks on a version bump.
        run: python scripts/audit_dependencies.py
      - name: Compile Python sources
        run: python -m compileall -q src tests

  container:
    # The shipped image, built ONCE from the Dockerfile (its Python is the Dockerfile's pinned base, not a
    # matrix value), then tested as built: the whole suite runs INSIDE that exact image against the
    # Portmark it installed from the hash-locked runtime set, and the deployment-profile tests run the
    # image from the host.
    runs-on: ubuntu-latest
    env:
      IMAGE: portmark-ci:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build the image
        run: docker build -t "$IMAGE" .
      - name: Check the image runs the Dockerfile's Python and its own installed Portmark
        run: |
          WANT=$(sed -n 's/^FROM python:\([0-9][0-9.]*\)-slim-bookworm@sha256:[0-9a-f]\{64\}$/\1/p' Dockerfile)
          test -n "$WANT"
          GOT=$(docker run --rm "$IMAGE" python -c "import platform; print(platform.python_version())")
          echo "Dockerfile=$WANT image=$GOT"
          test "$GOT" = "$WANT"
          docker run --rm "$IMAGE" python -m pip check
          docker run --rm "$IMAGE" python -c "import portmark, sysconfig; assert portmark.__file__.startswith(sysconfig.get_paths()['purelib']), portmark.__file__"
      - name: Run the regression suite inside the image
        # The checkout is mounted read-only and its src/ is hidden behind an empty tmpfs, so every test
        # imports the Portmark INSTALLED in the image. The image has no Node.js; the five Node-backed
        # Wasm tests skip only because this run declares it (PORTMARK_TEST_ENV_HAS_NO_NODE=1). Tests
        # that need docker or PostgreSQL skip here and run in the steps and jobs that provide them.
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE":/repo:ro --tmpfs /repo/src -w /repo
          -e PYTHONDONTWRITEBYTECODE=1 -e PORTMARK_TEST_ENV_HAS_NO_NODE=1
          "$IMAGE" python -m unittest discover -s tests -v
      - name: Install the host test runner (hash-locked)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/bootstrap.txt
          python -m pip install --require-hashes --no-deps -r requirements/runtime.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Verify hardened deployment profile (Section 7 PR 3)
        # Runs the profile probe inside the just-built image with the full hardening flags (every
        # property must hold) and re-runs with each flag removed (that property must flip). Also
        # proves openat2(RESOLVE_BENEATH) is not blocked by the image's seccomp profile.
        # Section 11 #1: the same image also proves the entrypoint's public-mode gate and loopback default.
        run: PORTMARK_TEST_IMAGE="$IMAGE" python -m unittest discover -s tests -k DeploymentProfileTests -v

  native-wasmtime:
    # Section 9 (#4): the REAL native Wasmtime engine on every architecture and OS it ships for,
    # at the release pin (wasmtime==48.0.0 from the [wasmtime] extra). Each lane asserts the same
    # hand-derived decision vector, canonical NaN, and deterministic relaxed-SIMD results, so the
    # lanes agree with each other. Each lane also proves its platform's worker-cap outcome: capped
    # and running, or blocked by default (macOS is decided by the runtime self-check, not assumed).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install hash-locked build tooling
        run: python -m pip install --require-hashes --no-deps -r requirements/bootstrap.txt
      - name: Install package with the hash-locked Wasmtime extra
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/wasmtime.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Show platform and Wasmtime version
        run: python -c "import platform, sys, importlib.metadata as m; print(sys.platform, platform.machine(), 'wasmtime', m.version('wasmtime'))"
      - name: Run native Wasmtime regression (real engine)
        run: python -m unittest discover -s tests -k real_native_wasmtime -v
      - name: Run malformed-component fuzz campaign (real engine)
        # Deterministic (fixed seed): any finding reproduces from its printed case index. Fails on
        # any uncontrolled error, worker crash signal, deadline overrun, leftover worker, or a
        # corpus too shallow to prove anything (coverage check).
        run: python tests/fuzz_wasmtime_components.py --inproc-cases 3000 --e2e-cases 30

  official-a2a-sdk:
    # The [a2a] extra is the one optional dependency no other job installed, so the two tests that need the
    # REAL SDK -- test_local_agent_card_parses_under_strict_official_schema and
    # test_local_and_sdk_agent_cards_are_identical -- skipped in every lane, and an a2a-sdk bump could go
    # green having never run them once. This lane installs the extra at its hash-locked pin on the OLDEST
    # and NEWEST supported Python (requires-python is >=3.11) and treats a SKIP as a failure: a silent skip
    # is exactly what made the gap invisible, so a job that can skip its way to green is not a gate.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install hash-locked build tooling
        run: python -m pip install --require-hashes --no-deps -r requirements/bootstrap.txt
      - name: Install package with the hash-locked A2A extra
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/a2a.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Show Python and a2a-sdk version
        run: python -c "import sys, importlib.metadata as m; print(sys.version, 'a2a-sdk', m.version('a2a-sdk'))"
      - name: Prove the real SDK is importable
        # The tests below gate on find_spec("a2a"). Without this step a failed or partial install would
        # turn them into skips and the lane would pass having proved nothing.
        run: python -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('a2a') else 1)"
      - name: Run the official-SDK conformance tests, and fail if either one skipped
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v \
            -k test_local_agent_card_parses_under_strict_official_schema \
            -k test_local_and_sdk_agent_cards_are_identical 2>&1 | tee sdk.log
          grep -q '^Ran 2 tests' sdk.log || { echo 'expected exactly 2 tests to be selected'; exit 1; }
          # A skipped run still prints a final "OK (skipped=n)". Only a bare OK line means both really ran.
          grep -qx 'OK' sdk.log || { echo 'a test skipped; that is a failure in this lane'; exit 1; }
      - name: Run every A2A test with the SDK present
        # Importing the SDK switches which branch of src/portmark/official_a2a.py runs, so the whole A2A
        # surface is exercised in that configuration, not only the two conformance tests. Scoped to A2A on
        # purpose: this lane installs no Node and no Wasmtime, so the capsule tests in the same file would
        # be measuring this job's cold start rather than anything about the SDK. The `test` lanes own those.
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_runtime.py -k a2a 2>&1 | tee a2a.log
          COUNT=$(sed -n 's/^Ran \([0-9]*\) test.*/\1/p' a2a.log)
          # `unittest` exits 0 when a selector matches NOTHING, so the count is the real guard: a rename
          # that silently empties this step must fail it, not pass it.
          [ "${COUNT:-0}" -ge 10 ] || { echo "only ${COUNT:-0} A2A tests selected; expected the full set"; exit 1; }

  postgres-store:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Section 11 #4: pinned by digest (multi-arch index, observed 2026-09-19); Dependabot cannot
        # bump a workflow service image, so refresh it with `docker buildx imagetools inspect postgres:17`.
        image: postgres:17@sha256:a6ec007920913e8d715a41e68a17b05ddf30e62d69565814988a896767594cc6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portmark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portmark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # This job runs the WHOLE suite, including the Node Wasm tests, so it needs the same pinned
      # Node as every other job. Without it the suite ran on the image's own Node, and the first
      # Node start of the run paid a cold-start cost inside a 2.0 s test deadline (the recurring
      # postgres-store flake of test_real_wasm_capsule_completes_inside_deadline_limited_sandbox).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install hash-locked build tooling
        run: python -m pip install --require-hashes --no-deps -r requirements/bootstrap.txt
      - name: Install package with the hash-locked Postgres extra
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/postgres.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Run the full suite with PostgreSQL enabled
        # Run the WHOLE suite against real Postgres, not a -k slice: every Postgres-gated
        # test (the store-contract, migration, CAS/nonce, and section-1 cold-init race +
        # migration-outbox tests) must actually execute here, or a Postgres-only fix has
        # no CI prover. A name filter silently skipped tests whose names it did not match.
        env:
          PORTMARK_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/portmark
        run: python -m unittest discover -s tests -v

  windows-tests:
    # Proves the cross-platform process-tree hard-kill: the isolated-tool
    # descendant-kill, side-effecting, and kill-audit tests run here via the Windows
    # Job Object executor instead of being skipped off-POSIX (0.9.0).
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install hash-locked build tooling
        run: python -m pip install --require-hashes --no-deps -r requirements/bootstrap.txt
      - name: Install package with hash-locked dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/runtime.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q src tests

  lockfile:
    # Section 11 #4: uv.lock must match pyproject.toml, and every requirements/*.txt must be the exact
    # export of uv.lock, or the hash-locked installs above would install something else than locked.
    # A Dependabot pin bump fails here until `uv lock` + scripts/lock_requirements.py are committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install hash-locked uv
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/bootstrap.txt
          python -m pip install --require-hashes --no-deps -r requirements/release.txt
      - name: Check uv.lock and the requirements exports are current
        run: python scripts/lock_requirements.py --check
      - name: Prove --require-hashes refuses changed bytes
        # A negative control, so the hash pinning above cannot be decorative. EVERY hash in a copy of the
        # runtime export is replaced (pip accepts a file matching ANY listed hash, so changing one
        # platform's hash proves nothing), and --ignore-installed forces a download (an already
        # installed package is never hash-checked). The install must fail with pip's hash-mismatch
        # error specifically, not with any other error such as a network failure. The untampered
        # export must then pass the same command.
        run: |
          sed 's/--hash=sha256:[0-9a-f]\{64\}/--hash=sha256:'"$(printf '0%.0s' $(seq 64))"'/g' requirements/runtime.txt > tampered.txt
          ! cmp -s requirements/runtime.txt tampered.txt
          if python -m pip install --require-hashes --no-deps --ignore-installed --dry-run -r tampered.txt 2> tampered.err; then
            echo 'a tampered export was accepted'; exit 1
          fi
          grep -q 'DO NOT MATCH THE HASHES' tampered.err || { cat tampered.err; echo 'refused, but not by the hash check'; exit 1; }
          python -m pip install --require-hashes --no-deps --ignore-installed --dry-run -r requirements/runtime.txt
