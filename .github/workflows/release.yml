name: Release

# Publishes to PyPI using Trusted Publishing: GitHub proves this workflow's identity
# to PyPI with a short-lived OIDC token, so no API token exists to store or leak.
# There is deliberately no `password:` and no repository secret anywhere below.
#
# Triggered by pushing a version tag:  git tag v0.3.0 && git push origin v0.3.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Pin build tooling
        run: python -m pip install pip==26.2.1 setuptools==83.0.0 build==1.3.0 twine==6.2.0

      # A tag can point at any commit, including one that never passed CI.
      # Publishing is irreversible on PyPI, so re-run the suite against the exact
      # tree being shipped rather than trusting that main was green.
      - name: Install package
        run: python -m pip install -e .
      - name: Run regression tests
        run: python -m unittest discover -s tests

      # A tag that disagrees with pyproject would publish the wrong version number
      # under the right-looking tag. Fail before anything is uploaded.
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import importlib.metadata as m; print(m.version('portmark'))")
          echo "tag=$TAG_VERSION package=$PKG_VERSION"
          test "$TAG_VERSION" = "$PKG_VERSION"

      - name: Build distributions
        run: |
          rm -rf dist
          python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Named environment so PyPI can pin the publisher to it, and so a manual
    # approval rule can be added on the GitHub side without touching this file.
    environment:
      name: pypi
      url: https://pypi.org/p/portmark
    permissions:
      # The only permission this job holds. It cannot read the repository,
      # and it holds no token that outlives the run.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
