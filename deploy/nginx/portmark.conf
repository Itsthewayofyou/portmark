# Reference Nginx front for the Portmark A2A listener.
#
# Run Portmark on loopback:
#   portmark serve --bind 127.0.0.1 --port 8080
#
# Replace portmark.example.com and certificate paths before deployment.

limit_req_zone $binary_remote_addr zone=portmark_agent_card_rate:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=portmark_a2a_rate:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=portmark_a2a_conn:10m;

server {
    listen 443 ssl http2;
    server_name portmark.example.com;

    ssl_certificate /etc/letsencrypt/live/portmark.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portmark.example.com/privkey.pem;

    client_max_body_size 1m;
    client_body_timeout 10s;
    keepalive_timeout 15s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

    location = /.well-known/agent-card.json {
        limit_req zone=portmark_agent_card_rate burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /message:send {
        limit_req zone=portmark_a2a_rate burst=20 nodelay;
        limit_conn portmark_a2a_conn 8;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name portmark.example.com;
    return 308 https://$host$request_uri;
}
