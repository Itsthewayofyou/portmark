name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package
        run: python -m pip install -e .
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Run parser fuzz target
        run: python tests/fuzz_a2a_parser.py
      - name: Run security scan
        run: python -m pip install bandit==1.9.4 && bandit -q -r src tests
      - name: Run dependency vulnerability audit
        run: python -m pip install pip-audit==2.10.1 && pip-audit --strict
      - name: Compile Python sources
        run: python -m compileall -q src tests
