name: CLA

# A contribution may only be merged once its author has signed the agreement in CLA.md. Portmark
# enforces that here rather than asking for it in CONTRIBUTING.md, for the same reason the runtime
# enforces a permit rather than requesting one politely: an unsigned contribution that gets merged
# cannot be un-merged, and it is the one thing that could freeze Portmark's licensing permanently.
#
# `pull_request`, deliberately, and NOT `pull_request_target`. Everything this check needs is readable:
# the signature record and the list of changed files. A fork's token on a public repository is read-only,
# which is exactly enough, so there is no reason to take the elevated token -- and two good reasons not
# to. `pull_request_target` runs only from the BASE branch's copy of the file, so it cannot run at all
# until it is merged, which makes it impossible to test on the pull request that adds it; and it attaches
# its result to the base commit rather than to the pull request's head, which is awkward to require.
#
# This workflow still never checks out, builds, or executes anything from the pull request -- it reads
# two API responses and compares strings. Every value taken from the event goes through `env` and is only
# ever referenced as a quoted shell variable, so no field of the event can reach the shell as code. Both
# the signature record and the file list are read at the BASE commit, so a pull request cannot sign
# itself by editing the record it is checked against.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Keyed on the event as well as the pull request, so a run is only ever cancelled by a newer run of
  # the same kind. Keyed on the number alone, the `pull_request` run and the `pull_request_target` run
  # that both exist while this trigger is being changed cancel each other, and a cancelled run reports
  # as a failure -- a red mark for a check that did its job.
  group: cla-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signed:
    name: contributor has signed the CLA
    runs-on: ubuntu-latest
    steps:
      - name: Check the signature record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RECORD: .cla-signatures.json
        run: |
          set -euo pipefail

          printf 'author: %s (%s)\n' "$AUTHOR" "$AUTHOR_TYPE"

          # Automation holds no copyright, so it has nothing to license. Matched on the account type the
          # API reports rather than on a name, which anyone can choose for themselves.
          if [ "$AUTHOR_TYPE" = "Bot" ]; then
            printf '::notice::%s is automation; no agreement is needed.\n' "$AUTHOR"
            exit 0
          fi

          # The licensor does not sign an agreement with himself.
          if [ "$AUTHOR" = "$OWNER" ]; then
            printf '::notice::%s is the Project Owner; no agreement is needed.\n' "$AUTHOR"
            exit 0
          fi

          # A pull request that only adds a signature is how someone signs, so it cannot require a
          # signature first. It still has to be reviewed and merged by the Project Owner, who confirms
          # the signer and the author are the same person -- that confirmation is the real gate here.
          changed=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' | sort -u)
          if [ "$changed" = "$RECORD" ]; then
            printf '::notice::This pull request only adds a signature. The Project Owner must confirm the signer is %s before merging.\n' "$AUTHOR"
            exit 0
          fi

          # Read the record at the BASE commit, as raw bytes. Reading it from the merge result would let
          # a pull request add its own author and pass its own check.
          #
          # Both failures below are reported rather than left to `set -e`. A job that aborts looks
          # identical to a job that broke for an unrelated reason, so each refusal says which one it is
          # -- both for whoever has to fix it, and so a test can tell a decision from a collapse.
          if ! record=$(gh api "repos/$REPO/contents/$RECORD?ref=$BASE_SHA" \
                          -H "Accept: application/vnd.github.raw" 2>&1); then
            printf '::error::Could not read %s at the base commit. Refusing, because a check that cannot see the signature record cannot clear anybody.\n' "$RECORD"
            exit 1
          fi

          # Read with python3 rather than jq: it is preinstalled on the runner, it is what the rest of
          # Portmark is written in, and it is available anywhere this step is tested. The author's name
          # reaches it through the environment, never as code. Malformed JSON raises, and the bare
          # assignment means `set -e` aborts on it -- a record that cannot be parsed refuses the
          # contribution rather than passing it.
          # Read with python3 rather than jq: it is preinstalled on the runner, it is what the rest of
          # Portmark is written in, and it is available anywhere this step is tested. The author's name
          # reaches it through the environment, never as code.
          #
          # Logins are compared case-insensitively, because GitHub treats them that way: somebody who
          # signs as `Some-Dev` and opens a pull request as `some-dev` is the same person, and refusing
          # them would be a false refusal that looks like a broken gate.
          if ! version=$(printf '%s' "$record" | python3 -c 'import json, os, sys; a = os.environ["AUTHOR"].casefold(); print(next(((e.get("agreement_version") or "unrecorded") for e in (json.load(sys.stdin).get("signatures") or []) if (e.get("login") or "").casefold() == a), ""), end="")' 2>&1); then
            printf '::error::%s could not be read as a signature record. Refusing, because an unreadable record clears nobody.\n' "$RECORD"
            exit 1
          fi

          if [ -n "$version" ]; then
            printf '::notice::%s signed CLA.md version %s.\n' "$AUTHOR" "$version"
            exit 0
          fi

          printf '::error::%s has not signed the Portmark Contributor License Agreement.\n' "$AUTHOR"
          cat <<'MESSAGE'

          This pull request cannot be merged yet.

          Portmark needs a Contributor License Agreement on record for every contributor. You keep the
          copyright in your own work; the agreement is in CLA.md, and you sign it once.

          To sign, open a pull request that adds you to .cla-signatures.json and changes nothing else:

              {
                "login": "<your GitHub username>",
                "name": "<your full legal name>",
                "kind": "individual",
                "agreement_version": "1.0",
                "date": "<YYYY-MM-DD>"
              }

          Use "kind": "corporate" instead if your employer owns the work, and sign as the entity. See
          CONTRIBUTING.md.
          MESSAGE
          exit 1
