version: 2

# Workflow actions are pinned to commit SHAs rather than moving tags, because the
# publish job holds id-token: write and a compromised `@release/v1` would be a path
# straight to PyPI under this project's name. A pin that nobody bumps rots into a
# stale-dependency risk, so Dependabot maintains them.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    # One weekly PR for all action pins instead of one PR per action.
    groups:
      github-actions:
        patterns: ["*"]

  # Runtime and optional dependencies are exact-pinned in pyproject.toml. The audit
  # gate fails the build on a known vulnerability, but only once one is published --
  # this raises the PR that fixes it. Section 11 #4: such a PR fails CI's `lockfile` job until
  # `uv lock` and `python scripts/lock_requirements.py` are run on it and committed, so the
  # hash-locked installs always match the pins.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    # One weekly PR for all version updates, so the relock + export above is done once per week, not
    # once per package. Security updates are not grouped (`applies-to` defaults to version-updates):
    # a fix for a published vulnerability still arrives as its own PR, straight away.
    groups:
      python-dependencies:
        applies-to: version-updates
        patterns: ["*"]

  # Section 11 #4: the Dockerfile's base image is pinned by digest. Dependabot proposes a new tag AND
  # its digest. Only Python patch releases are proposed: a new Python minor (or major) version must first
  # be added to CI's test matrices and the classifiers, which tests/test_runtime.py enforces, so it is
  # done by hand, never as a bot bump. Workflow service images (postgres in ci.yml) are pinned by digest
  # too, but Dependabot does not update those -- refresh them by hand (see the comment at the pin).
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
    labels:
      - dependencies
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
