name: CI

on:
  # Unfiltered `push` plus `pull_request` ran the whole matrix twice for every
  # push to a branch with an open PR, doubling load on the runner. Branch pushes
  # are now covered by the pull_request event alone.
  push:
    branches: [main]
  pull_request:

concurrency:
  # Supersede in-flight runs for the same PR; never cancel a run for main.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Pin build tooling
        run: python -m pip install pip==26.2.1 setuptools==83.0.0
      - name: Install package
        run: python -m pip install -e .
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check security.py coverage
        run: |
          python -m pip install coverage==7.16.0
          coverage run --source=portmark.security -m unittest discover -s tests -q
          coverage report --include='src/portmark/security.py' --fail-under=95
      - name: Run native Wasmtime component regression
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install -e '.[wasmtime]'
          python -m unittest discover -s tests -k real_native_wasmtime -v
      - name: Run parser fuzz target
        run: python tests/fuzz_a2a_parser.py
      - name: Run security scan
        run: python -m pip install bandit==1.9.4 && bandit -q -r src tests
      - name: Run dependency vulnerability audit
        # Fails closed on vulnerabilities AND on anything that could not be audited,
        # with one named exemption for portmark's own editable install. See the module
        # docstring for why plain `pip-audit --strict` deadlocks on a version bump.
        run: python -m pip install pip-audit==2.10.1 && python scripts/audit_dependencies.py
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Build Docker image
        run: docker build -t portmark-ci:${{ matrix.python-version }} .

  postgres-store:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portmark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portmark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Pin build tooling
        run: python -m pip install pip==26.2.1 setuptools==83.0.0
      - name: Install package with Postgres extra
        run: python -m pip install -e '.[postgres]'
      - name: Run Postgres store contract tests
        env:
          PORTMARK_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/portmark
        run: python -m unittest discover -s tests -k runtime_store_contract -v
