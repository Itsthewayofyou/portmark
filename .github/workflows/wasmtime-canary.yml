name: Wasmtime upgrade canary

# Section 9 (#4): releases stay pinned to wasmtime==48.0.0 (the [wasmtime] extra). This separate,
# non-blocking workflow runs the real native-Wasmtime suite against the LATEST wasmtime release,
# so a behaviour change -- or a new proposal setter that _engine_config does not yet assign (see
# test_real_native_wasmtime_engine_config_assigns_every_proposal_setter) -- shows up here before
# anyone bumps the pin. A red canary means "decide before upgrading", not "main is broken".
on:
  schedule:
    - cron: "17 6 * * 1"  # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  latest-wasmtime:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install hash-locked build tooling
        run: python -m pip install --require-hashes --no-deps -r requirements/bootstrap.txt
      # Section 11 #4: everything is hash-locked EXCEPT the one package this canary exists to float.
      # Deliberately unpinned: it builds and publishes nothing, has read-only permissions, and a red
      # run blocks nothing (tests/test_section11_supply_chain.py allows exactly this line, here only).
      - name: Install package, then upgrade Wasmtime past the release pin
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/wasmtime.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip install --upgrade wasmtime
      - name: Show Wasmtime version under test
        run: python -c "import importlib.metadata as m; print('wasmtime', m.version('wasmtime'))"
      - name: Run native Wasmtime regression (real engine, latest release)
        run: python -m unittest discover -s tests -k real_native_wasmtime -v
